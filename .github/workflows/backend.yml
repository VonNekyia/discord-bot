name: Backend

# Siehe docs/entwicklung/ci.md, „Backend“.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: bot

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Eine Wegwerf-PostgreSQL nur für diesen Lauf; das Passwort ist kein Secret.
    # Das Image fest an seinen Digest, siehe docs/entwicklung/ci.md, „Actions und Images“.
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18, 18.6
        env:
          POSTGRES_DB: kitty
          POSTGRES_USER: kitty
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kitty -d kitty"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: kitty
      DB_USER: kitty
      DB_PASSWORD: ci
    steps:
      # Actions fest an einen Commit, ohne gespeichertes Token.
      # Siehe docs/entwicklung/ci.md, „Actions und Images“.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - run: npm ci

      # tsc ist Build und Lint zugleich: strict und ohne Unbenutztes.
      - name: Build und Tests
        timeout-minutes: 10
        run: npm test

      - name: Sicherheitslücken
        timeout-minutes: 5
        run: npm audit --omit=dev --audit-level=high

      - name: Lizenzen
        timeout-minutes: 2
        run: node ../.github/pruefe-lizenzen.mjs package-lock.json

      # Ein Paket unter GPL muss die Prüfung anschlagen lassen, auch wenn die
      # GPL hinter einer Klammer mit AND steht; eine Wahl mit OR nicht.
      - name: Probe, dass die Lizenzprüfung anschlägt
        timeout-minutes: 2
        run: |
          echo '{"packages":{"":{},"node_modules/x":{"license":"GPL-3.0"},"node_modules/y":{"license":"(MIT OR GPL-3.0)"},"node_modules/z":{"license":"(MIT OR GPL-3.0) AND GPL-2.0"}}}' > probe.json
          if node ../.github/pruefe-lizenzen.mjs probe.json > probe.txt; then
            echo "Die Prüfung hat nichts gemeldet."
            exit 1
          fi
          sed 's/^::error /Probe: /' probe.txt
          test "$(grep -c '^::error ' probe.txt)" -eq 2
