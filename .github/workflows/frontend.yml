name: Frontend

# Siehe docs/entwicklung/ci.md, „Frontend“.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # tsc ist Build und Lint zugleich: strict und ohne Unbenutztes.
      - name: Build
        timeout-minutes: 5
        run: npm run build

      - name: Sicherheitslücken
        timeout-minutes: 5
        run: npm audit --omit=dev --audit-level=high

      - name: Lizenzen
        timeout-minutes: 2
        run: node ../.github/pruefe-lizenzen.mjs package-lock.json

      - name: Server starten
        timeout-minutes: 2
        run: |
          node serve.mjs 4173 &
          until curl -fs -o /dev/null http://127.0.0.1:4173/; do sleep 1; done

      # Antwortet anstelle des Bots auf /api/ mit 401, damit Lighthouse
      # /dashboard/ abgemeldet misst. Siehe docs/entwicklung/ci.md, „Frontend“.
      - name: API-Stub starten
        timeout-minutes: 2
        run: |
          node -e 'require("node:http").createServer((q, a) => a.writeHead(401, { "Content-Type": "application/json" }).end(JSON.stringify({ code: "nicht_angemeldet" }))).listen(4174, "127.0.0.1")' &
          until curl -s -o /dev/null http://127.0.0.1:4174/; do sleep 1; done

      - name: Header
        timeout-minutes: 2
        run: |
          kopf=$(curl -fsSI http://127.0.0.1:4173/ | tr -d '\r')
          fehler=0
          for soll in 'content-security-policy: ' 'permissions-policy: ' \
            'referrer-policy: strict-origin-when-cross-origin' \
            'x-content-type-options: nosniff' 'x-frame-options: sameorigin'; do
            grep -qix "$soll.*" <<< "$kopf" || { echo "::error::Header fehlt oder falsch: $soll"; fehler=1; }
          done
          if grep -i '^content-security-policy:' <<< "$kopf" | grep -q 'unsafe-inline'; then
            echo "::error::Die CSP erlaubt unsafe-inline"
            fehler=1
          fi
          exit $fehler

      - name: Lighthouse
        timeout-minutes: 10
        run: npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: web/lighthouse
          retention-days: 14
          if-no-files-found: ignore
