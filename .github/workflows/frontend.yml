name: Frontend

# Siehe docs/entwicklung/ci.md, „Frontend“.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Actions fest an einen Commit, ohne gespeichertes Token.
      # Siehe docs/entwicklung/ci.md, „Actions und Images“.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Funde stehen als Anmerkung an ihrer Zeile in der PR; oxlint nennt
      # Pfade ab web/, GitHub braucht sie ab der Wurzel.
      # Siehe docs/entwicklung/lint.md, „Aufrufen“.
      - name: Lint
        timeout-minutes: 5
        run: |
          set -o pipefail
          npm run lint --silent -- --format=github | sed 's|^\(::[a-z]* file=\)|\1web/|'

      - name: Build
        timeout-minutes: 5
        run: npm run build

      # Die Prüfer der API gegen die Beispiele des Vertrags.
      # Siehe docs/entwicklung/tests.md, „Die Oberfläche“.
      - name: Tests
        timeout-minutes: 5
        run: npm test

      - name: Sicherheitslücken
        timeout-minutes: 5
        run: npm audit --omit=dev --audit-level=high

      - name: Lizenzen
        timeout-minutes: 2
        run: node ../.github/pruefe-lizenzen.mjs package-lock.json

      - name: Server starten
        timeout-minutes: 2
        run: |
          node serve.mjs 4173 &
          until curl -fs -o /dev/null http://127.0.0.1:4173/; do sleep 1; done

      # Antwortet anstelle des Bots auf /api/ mit 401, damit Lighthouse
      # /dashboard/ abgemeldet misst. Siehe docs/entwicklung/ci.md, „Frontend“.
      - name: API-Stub starten
        timeout-minutes: 2
        run: |
          node -e 'require("node:http").createServer((q, a) => a.writeHead(401, { "Content-Type": "application/json" }).end(JSON.stringify({ code: "nicht_angemeldet" }))).listen(4174, "127.0.0.1")' &
          until curl -s -o /dev/null http://127.0.0.1:4174/; do sleep 1; done

      # Jeder Header aus web/_headers: CSP und Permissions-Policy, ob sie da
      # sind, die anderen mit genau ihrem Wert.
      # Siehe docs/frontend/auslieferung.md, „Header“.
      - name: Header
        timeout-minutes: 2
        run: |
          kopf=$(curl -fsSI http://127.0.0.1:4173/ | tr -d '\r')
          fehler=0
          for soll in 'content-security-policy: .+' 'permissions-policy: .+' \
            'referrer-policy: strict-origin-when-cross-origin' \
            'x-content-type-options: nosniff' 'x-frame-options: sameorigin' \
            'cross-origin-opener-policy: same-origin' 'cross-origin-resource-policy: same-origin'; do
            grep -qixE "$soll" <<< "$kopf" || { echo "::error::Header fehlt oder falsch: ${soll%.+}"; fehler=1; }
          done
          if grep -i '^content-security-policy:' <<< "$kopf" | grep -q 'unsafe-inline'; then
            echo "::error::Die CSP erlaubt unsafe-inline"
            fehler=1
          fi
          exit $fehler

      - name: Lighthouse
        timeout-minutes: 10
        run: npm run lighthouse

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse
          path: web/lighthouse
          retention-days: 14
          if-no-files-found: ignore
