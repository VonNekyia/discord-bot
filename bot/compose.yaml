# Die Dev-Datenbank, nur von diesem Rechner aus erreichbar. Liest bot/.env.
#
#   docker compose up -d
#
# Siehe docs/bot/datenbank.md, „Dev-Datenbank“.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME fehlt in bot/.env}
      POSTGRES_USER: ${DB_USER:?DB_USER fehlt in bot/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in bot/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - daten:/var/lib/postgresql
    # Über TCP: Beim ersten Start lauscht PostgreSQL zuerst nur am Socket.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  daten:
